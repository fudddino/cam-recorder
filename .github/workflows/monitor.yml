name: On-Demand Cam Recorder

on:
  schedule:
    - cron: '*/15 * * * *'  # Automatically checks every 15 minutes
  workflow_dispatch:        # Enables manual trigger button

jobs:
  check-and-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Streamlink & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlink requests

      - name: Run Recording Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python recorder.py
