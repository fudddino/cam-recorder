<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CamVault - Control Panel</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; font-size: 1.8rem; margin-bottom: 24px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 1rem; margin-bottom: 12px; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-bottom: 8px; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .btn-secondary { background: #334155; color: #cbd5e1; }
    .preview-box { text-align: center; margin-top: 16px; display: none; }
    .preview-box img { width: 100%; border-radius: 8px; margin-bottom: 12px; }
    .status-msg { margin-top: 12px; text-align: center; font-size: 0.9rem; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📹 CamVault Control</h1>

    <!-- Configuration Box -->
    <div class="card">
      <label for="patToken">GitHub Personal Access Token</label>
      <input type="password" id="patToken" placeholder="github_pat_..." onchange="saveToken()">
      <label for="repoName">Repository (username/repo)</label>
      <input type="text" id="repoName" placeholder="fudddino/cam-recorder" onchange="saveToken()">
    </div>

    <!-- Search & Add Box -->
    <div class="card">
      <label for="modelInput">Search Model Username</label>
      <input type="text" id="modelInput" placeholder="e.g. monicarossi95">
      <button id="searchBtn" onclick="searchModel()">🔍 Check Live Status & Preview</button>
      <button id="quickAddBtn" class="btn-secondary" onclick="addModelToWatchlist()">➕ Add to Watchlist (Skip Preview)</button>

      <div id="previewBox" class="preview-box">
        <img id="thumbImg" src="" alt="Live Preview">
        <button id="addBtn" onclick="addModelToWatchlist()">🔴 Add to Recording Watchlist</button>
      </div>

      <div id="status" class="status-msg"></div>
    </div>
  </div>

  <script>
    document.getElementById('patToken').value = localStorage.getItem('pat_token') || '';
    document.getElementById('repoName').value = localStorage.getItem('repo_name') || 'fudddino/cam-recorder';

    function saveToken() {
      localStorage.setItem('pat_token', document.getElementById('patToken').value.trim());
      localStorage.setItem('repo_name', document.getElementById('repoName').value.trim());
    }

    async function searchModel() {
      const username = document.getElementById('modelInput').value.trim().toLowerCase();
      const statusDiv = document.getElementById('status');
      const previewBox = document.getElementById('previewBox');
      
      if (!username) return alert('Please enter a model username');

      statusDiv.style.color = '#38bdf8';
      statusDiv.innerText = 'Checking model room...';
      previewBox.style.display = 'none';

      try {
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent('https://chaturbate.com/' + username + '/')}`;
        const res = await fetch(proxyUrl);
        const data = await res.json();
        
        // If room page loads and isn't 404
        if (data.contents && !data.contents.includes('404 Page Not Found')) {
          const thumbUrl = `https://roomimg.stream.highwebmedia.com/ri/${username}.jpg?t=${Date.now()}`;
          document.getElementById('thumbImg').src = thumbUrl;
          previewBox.style.display = 'block';
          statusDiv.style.color = '#4ade80';
          statusDiv.innerText = `Model "${username}" room found!`;
        } else {
          statusDiv.style.color = '#f87171';
          statusDiv.innerText = `Model "${username}" does not exist on Chaturbate.`;
        }
      } catch (e) {
        statusDiv.style.color = '#facc15';
        statusDiv.innerText = 'Could not fetch preview. You can still tap "Add to Watchlist" below!';
        previewBox.style.display = 'block';
      }
    }

    async function addModelToWatchlist() {
      const token = localStorage.getItem('pat_token');
      const repo = localStorage.getItem('repo_name');
      const username = document.getElementById('modelInput').value.trim().toLowerCase();
      const statusDiv = document.getElementById('status');

      if (!username) return alert('Please enter a model username');
      if (!token || !repo) return alert('Please enter your GitHub PAT Token and Repository name first.');

      statusDiv.style.color = '#38bdf8';
      statusDiv.innerText = 'Updating models.txt on GitHub...';

      const targetUrl = `https://chaturbate.com/${username}/`;
      const githubApiUrl = `https://api.github.com/repos/${repo}/contents/models.txt`;

      try {
        const getRes = await fetch(githubApiUrl, {
          headers: { 'Authorization': `bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        
        if (!getRes.ok) throw new Error('Failed to fetch models.txt. Check repo path and PAT token.');
        const fileData = await getRes.json();
        
        const currentContent = atob(fileData.content);
        
        if (currentContent.includes(targetUrl) || currentContent.includes(username)) {
          statusDiv.style.color = '#facc15';
          statusDiv.innerText = `"${username}" is already in your models.txt!`;
          return;
        }

        const updatedContent = currentContent.trim() + '\n' + targetUrl + '\n';
        const encodedContent = btoa(updatedContent);

        const putRes = await fetch(githubApiUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `bearer ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify({
            message: `Add ${username} to watchlist via Web Dashboard`,
            content: encodedContent,
            sha: fileData.sha
          })
        });

        if (putRes.ok) {
          statusDiv.style.color = '#4ade80';
          statusDiv.innerText = `Successfully added ${username}! Recording script will pick it up on next run.`;
        } else {
          throw new Error('Failed to update models.txt');
        }
      } catch (err) {
        statusDiv.style.color = '#f87171';
        statusDiv.innerText = err.message;
      }
    }
  </script>
</body>
</html>
